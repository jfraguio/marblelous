<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F2EFE7" />
  <meta name="description" content="Marblelous — un taller infinito de canicas, rampas y música." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Marblelous" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F2EFE7'/%3E%3Crect x='10' y='30' width='32' height='16' rx='4' fill='%233D7EA6'/%3E%3Ccircle cx='44' cy='26' r='12' fill='%23D95D39'/%3E%3Ccircle cx='40' cy='22' r='3' fill='%23fff' opacity='.8'/%3E%3C/svg%3E" />
  <title>Marblelous</title>
</head>
<body>
  <div id="app">
    <canvas id="game" role="application" aria-label="Lienzo de construcción de canicas"></canvas>

    <div id="hud" aria-live="off">
      <header class="topbar">
        <nav class="top-actions" aria-label="Controles del taller">
          <button class="ibtn" id="btn-pause" aria-label="Pausar simulación" aria-pressed="false" title="Pausar simulación (P)"><svg class="ic"><use href="#i-pause"></use></svg></button>
          <button class="ibtn" id="btn-settings" aria-label="Ajustes"><svg class="ic"><use href="#i-settings"></use></svg></button>
        </nav>
      </header>

      <div class="side-left">
        <div class="mode-switch" id="mode-switch" role="group" aria-label="Modo de juego">
          <button class="mode-btn is-active" id="mode-build" aria-label="Construir">
            <svg class="ic"><use href="#i-brick"></use></svg>
          </button>
          <button class="mode-btn" id="mode-play" aria-label="Jugar">
            <svg class="ic"><use href="#i-marble"></use></svg>
          </button>
        </div>
        <div class="tool-stack">
          <button class="ibtn tool" id="btn-recenter" aria-label="Centrar"><svg class="ic"><use href="#i-target"></use></svg></button>
          <button class="ibtn tool" id="btn-zoom-in" aria-label="Acercar"><svg class="ic"><use href="#i-plus"></use></svg></button>
          <button class="ibtn tool" id="btn-zoom-out" aria-label="Alejar"><svg class="ic"><use href="#i-minus"></use></svg></button>
        </div>
      </div>

      <div id="selection-ui" class="selection-ui is-hidden">
        <div class="selection-actions">
        <button class="sel-btn" id="sel-rotate" aria-label="Rotar pieza"><svg class="ic"><use href="#i-rotate"></use></svg></button>
        <button class="sel-btn is-hidden" id="sel-size" aria-label="Cambiar longitud"><svg class="ic"><use href="#i-resize"></use></svg></button>
        <button class="sel-btn power is-hidden" id="sel-power" aria-label="Cambiar polaridad"><svg class="ic"><use href="#i-magnet"></use></svg></button>
        <button class="sel-btn" id="sel-duplicate" aria-label="Duplicar pieza"><svg class="ic"><use href="#i-copy"></use></svg></button>
        <button class="sel-btn" id="sel-precision" aria-label="Ajuste fino" aria-expanded="false" title="Ajuste fino (Alt + flechas)"><svg class="ic"><use href="#i-move"></use></svg></button>
        <button class="sel-btn is-hidden" id="sel-notes" aria-label="Afinar xilófono" title="Afinar xilófono"><svg class="ic"><use href="#i-note"></use></svg></button>
        <button class="sel-btn danger" id="sel-delete" aria-label="Borrar pieza"><svg class="ic"><use href="#i-trash"></use></svg></button>
        </div>
        <div id="nudge-controls" class="nudge-controls is-hidden" role="group" aria-label="Mover cuatro píxeles">
          <button data-nudge="-1,0" aria-label="Mover a la izquierda">←</button>
          <button data-nudge="0,-1" aria-label="Mover hacia arriba">↑</button>
          <button data-nudge="0,1" aria-label="Mover hacia abajo">↓</button>
          <button data-nudge="1,0" aria-label="Mover a la derecha">→</button>
        </div>
      </div>

      <button id="first-drop" class="first-drop is-hidden" title="Soltar una canica"><svg class="ic"><use href="#i-marble"></use></svg><span>Soltar una canica</span></button>
      <div id="workshop-hint" class="workshop-hint is-hidden">
        <span id="hint-text" aria-live="polite"></span>
        <button id="dismiss-hint" aria-label="Ocultar la guía"><svg class="ic"><use href="#i-close"></use></svg></button>
      </div>

      <div id="tray-wrap" class="tray-wrap">
        <div id="tray" class="tray" role="toolbar" aria-label="Bandeja de piezas"></div>
      </div>

      <div id="capacity" class="capacity is-hidden"><svg class="ic"><use href="#i-brick"></use></svg><span id="capacity-num">0</span></div>
    </div>

    <!-- Overlays -->
    <section id="settings" class="overlay is-hidden" role="dialog" aria-modal="true" aria-label="Ajustes">
      <div class="sheet narrow">
        <header class="sheet-head">
          <div class="sheet-title"><svg class="ic"><use href="#i-settings"></use></svg></div>
          <button class="ibtn close" data-close="settings" aria-label="Cerrar"><svg class="ic"><use href="#i-close"></use></svg></button>
        </header>
        <div id="settings-body" class="settings-body"></div>
      </div>
    </section>

    <section id="album" class="overlay is-hidden" role="dialog" aria-modal="true" aria-label="Álbum de talleres">
      <div class="sheet narrow album-sheet">
        <header class="sheet-head"><h2>Álbum de talleres</h2>
          <button id="new-workshop" class="album-primary">Nuevo taller</button>
          <button class="ibtn close" aria-label="Cerrar álbum"><svg class="ic"><use href="#i-close"></use></svg></button>
        </header>
        <div class="album-body">
          <form id="rename-workshop" class="rename-workshop is-hidden">
            <label for="workshop-name">Nombre del taller</label>
            <input id="workshop-name" maxlength="48" required autocomplete="off" />
            <button class="album-primary" type="submit">Guardar nombre</button>
          </form>
          <h3>Mis talleres</h3><div id="workshop-list" class="workshop-list"></div>
          <h3>Circuitos para probar</h3><div id="circuit-list" class="circuit-list"></div>
          <details class="classic-circuits"><summary>Estructuras clásicas</summary><div id="classic-list" class="circuit-list"></div></details>
        </div>
      </div>
    </section>

    <section id="tuning" class="overlay is-hidden" role="dialog" aria-modal="true" aria-label="Afinar xilófono">
      <div class="sheet narrow tuning-sheet">
        <header class="sheet-head"><h2>Afinar xilófono</h2>
          <button class="ibtn close" aria-label="Cerrar afinación"><svg class="ic"><use href="#i-close"></use></svg></button>
        </header>
        <div id="tuning-body" class="settings-body"></div>
      </div>
    </section>

    <div id="toast" class="toast is-hidden"></div>
    <div id="flash" class="flash"></div>

  </div>

  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.5c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7Z" fill="currentColor" stroke="none"/><path d="M19 15.5c.3 2 1 2.7 3 3-2 .3-2.7 1-3 3-.3-2-1-2.7-3-3 2-.3 2.7-1 3-3Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 5H4v2a4 4 0 0 0 4 4M16 5h4v2a4 4 0 0 1-4 4"/><path d="M12 12v4M8 20h8M9 20v-2h6v2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
      <symbol id="i-brick" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M8 9V7a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v2M15 9V7a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-marble" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="9" cy="9" r="2" fill="currentColor" stroke="none" opacity=".55"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 5L19 7"/></symbol>
      <symbol id="i-resize" viewBox="0 0 24 24"><path d="M4 12h16M7 8l-3 4 3 4M17 8l3 4-3 4"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 8V3l-2 2"/><path d="M20 3a9 9 0 1 0 1 9"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
      <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M3 4h6M15 4h6M3 8h6M15 8h6"/></symbol>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M7 6.4a8 8 0 1 0 10 0"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M10 20v-6h4v6"/></symbol>
      <symbol id="i-world" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M4 10a9 9 0 1 1 2 9"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4V8Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14m6-14v14" stroke-width="2.7"/></symbol>
      <symbol id="i-sweep" viewBox="0 0 24 24"><path d="m11 10 5-6m-7 7 5 4m-5-4-5 6 7 4 3-6m5 1h2m-5 4h3"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10v4h4l4 4V6l-4 4H4m11-1a4 4 0 0 1 0 6m2-8a7 7 0 0 1 0 10"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 20V4M6 10l6-6 6 6"/></symbol>
      <symbol id="i-quality" viewBox="0 0 24 24"><path d="M4 19v-5M9 19V9M14 19V5M19 19v-8"/></symbol>
      <symbol id="i-motion" viewBox="0 0 24 24"><path d="M3 8c3-4 6 4 9 0s6 4 9 0M3 16c3-4 6 4 9 0s6 4 9 0"/></symbol>
      <symbol id="i-haptics" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="3"/><path d="M4 8v8M20 8v8"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.1"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><rect x="5" y="3" width="15" height="18" rx="3"/><path d="M9 3v18m3-12h5m-5 4h3"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3m12-6 3 3-3 3"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4-.8L20 7l-3-3L5 16l-1 4Zm11-14 3 3"/></symbol>
    </defs>
  </svg>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
